name: Migration Drift Check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    migration-drift-check:
        # Dependabot runs do not receive repository secrets, so DATABASE_URL
        # would be empty and the job would fail on every dependency PR.
        if: ${{ github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Set up Node (from .nvmrc)
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install
              run: npm ci --workspaces --include-workspace-root

            # The check runs the compiled data source, so the api must be built.
            - name: Build api
              run: npm run build -w @paw-order/api

            - name: Check for migration drift
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              run: ./scripts/check-migration-drift.sh
